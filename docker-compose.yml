name: korbpuls

services:
  web:
    image: ghcr.io/malvavisc0/korbpuls:latest
    ports:
      - "8000:8000"
    environment:
      KORBPULS_API_KEY: ${KORBPULS_API_KEY}
      KORB_CMD: korb
      CACHE_DIR: /data
      WORKERS: 2
      # AI settings (leave empty to disable)
      OPENAILIKE_API_BASE: ${OPENAILIKE_API_BASE:-}
      OPENAILIKE_API_KEY: ${OPENAILIKE_API_KEY:-}
      OPENAILIKE_LLM: ${OPENAILIKE_LLM:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Rybbit analytics: disabled by default. The production deployment
      # sets DISABLE_TELEMETRY=false to load the analytics script.
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-true}
      RYBBIT_SCRIPT_URL: ${RYBBIT_SCRIPT_URL}
      RYBBIT_SITE_ID: ${RYBBIT_SITE_ID:-9feb491675c0}
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
